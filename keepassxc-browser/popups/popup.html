<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <title>PWSave</title>
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="../bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../fonts/fork-awesome.min.css">
    <script src="../common/browser-polyfill.min.js"></script>
    <script src="../common/global.js"></script>
    <script src="../common/global_ui.js"></script>
<script src="../common/totp-input.js"></script>
<script src="../common/jsQR.js"></script>
    <script src="../bootstrap/bootstrap.min.js"></script>
    <script defer src="popup.js"></script>
  </head>
  <body>
    <div class="pwsave-popup" id="popup-root">

      <!-- Sync setup (mandatory) -->
      <div id="sync-setup" class="screen text-center py-4 d-none">
        <p class="fw-bold mb-1">Connect your Google Drive</p>
        <p class="small text-muted mb-3">Your vault is encrypted on this device. Sign in with Google so your encrypted vault is kept in sync across your browsers.</p>
        <button id="signin-button" class="btn btn-primary w-100 mb-2">
          <i class="fa fa-google" aria-hidden="true"></i> Sign in with Google
        </button>
        <div id="sync-error" class="text-danger small mt-1 d-none"></div>
      </div>

      <!-- Lock screen -->
      <div id="lock-screen" class="screen text-center py-4 d-none">
        <p class="fw-bold mb-1" id="lock-title">Unlock vault</p>
        <p class="small text-muted mb-3">Enter your master password. The vault is decrypted locally.</p>
        <input id="master-password" type="password" class="form-control mb-2" placeholder="Master password" autocomplete="off">
        <div id="lock-error" class="text-danger small mt-1 mb-1 d-none"></div>
        <button id="unlock-button" class="btn btn-primary w-100">Unlock</button>
      </div>

      <!-- Main vault view -->
      <div id="vault-view" class="screen d-none">

        <!-- Header: home + search + actions -->
        <div class="rf-header">
          <button id="home-button" class="rf-home" title="Home">
            <i class="fa fa-home" aria-hidden="true"></i>
          </button>
          <div class="rf-search-wrap">
            <i class="fa fa-search rf-search-icon" aria-hidden="true"></i>
            <input id="search-input" type="text" class="rf-search-input" placeholder="Search PWSave" autocomplete="off" spellcheck="false">
          </div>
          <button id="copy-action-button" class="rf-header-btn" title="Copy">
            <i class="fa fa-copy" aria-hidden="true"></i>
          </button>
          <button id="menu-button" class="rf-header-btn" title="More options">
            <i class="fa fa-ellipsis-v" aria-hidden="true"></i>
          </button>
        </div>

        <!-- Dropdown menu -->
        <div id="rf-menu" class="rf-menu d-none">
          <button class="rf-menu-item" id="menu-generator">
            <i class="fa fa-key" aria-hidden="true"></i> Generate password
          </button>
          <div class="rf-menu-sep"></div>
          <button class="rf-menu-item" id="menu-options">
            <i class="fa fa-cog" aria-hidden="true"></i> Settings
          </button>
          <button class="rf-menu-item" id="menu-sync">
            <i class="fa fa-refresh" aria-hidden="true"></i> Sync now
          </button>
          <button class="rf-menu-item" id="menu-lock">
            <i class="fa fa-lock" aria-hidden="true"></i> Lock vault
          </button>
        </div>

        <!-- Toolbar: type selector (all logins) / fill tab (matching) -->
        <div class="rf-toolbar">
          <div class="rf-toolbar-left">
            <button id="type-selector" class="rf-type-btn" title="Show all logins" data-view="all">
              <i class="fa fa-lock rf-icon-green" aria-hidden="true"></i>
              <span class="rf-type-label">Logins</span>
              <span id="all-count" class="rf-view-count"></span>
            </button>
          </div>
          <button id="fill-button" class="rf-fill-btn" title="Show logins for this site" data-view="fill" type="button">
            <i class="fa fa-database rf-icon-blue" aria-hidden="true"></i>
            <span class="rf-fill-label">Fill Logins</span>
            <span id="fill-count" class="rf-view-count"></span>
          </button>
        </div>

        <!-- Login list -->
        <div id="entry-list" class="rf-list"></div>
        <div id="empty-state" class="text-center text-muted py-4 d-none">No entries found.</div>

      </div>
    </div>

    <!-- Add/Edit modal -->
    <div class="modal fade" id="entry-modal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h5 class="modal-title" id="entry-modal-title">Add entry</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-2">
              <label class="form-label small mb-1">Name</label>
              <input type="text" class="form-control form-control-sm" id="edit-name">
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">Username</label>
              <input type="text" class="form-control form-control-sm" id="edit-login">
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">Password</label>
              <div class="input-group input-group-sm">
                <input type="password" class="form-control" id="edit-password">
                <button class="btn btn-outline-secondary" id="edit-generate-password" title="Generate password" type="button">
                  <i class="fa fa-key" aria-hidden="true"></i>
                </button>
                <button class="btn btn-outline-secondary" id="edit-toggle-password" title="Show password" type="button">
                  <i class="fa fa-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">URL</label>
              <input type="text" class="form-control form-control-sm" id="edit-url">
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">Group / Folder</label>
              <input type="text" class="form-control form-control-sm" id="edit-group" placeholder="e.g. Facebook">
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">Note</label>
              <textarea class="form-control form-control-sm" id="edit-note" rows="2"></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">2FA / TOTP - optional</label>
              <div id="edit-totp-status" class="small d-none">
                <div class="d-flex align-items-center justify-content-between gap-2">
                  <span class="text-truncate"><span id="edit-totp-status-icon"></span> <span id="edit-totp-status-text"></span></span>
                  <span class="d-flex gap-1 flex-shrink-0">
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" id="edit-totp-change">Replace</button>
                    <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" id="edit-totp-remove">Remove</button>
                  </span>
                </div>
              </div>
              <div id="edit-totp-fields" class="d-none">
                <div class="input-group input-group-sm mb-1">
                  <input type="text" class="form-control" id="edit-totp-secret" placeholder="Secret key or otpauth:// URI">
                  <button type="button" class="btn btn-outline-secondary" id="edit-totp-scan" title="Scan a QR code shown on the page">
                    <i class="fa fa-qrcode" aria-hidden="true"></i>
                  </button>
                </div>
                <input type="text" class="form-control form-control-sm" id="edit-totp-label" placeholder="label (optional)">
              </div>
            </div>
          </div>
          <div class="modal-footer py-2">
            <button type="button" class="btn btn-sm btn-outline-danger d-none" id="delete-entry-button">Delete</button>
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-primary" id="save-entry-button">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Generator modal -->
    <div class="modal fade" id="generator-modal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h5 class="modal-title">Password generator</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="input-group input-group-sm mb-2">
              <input type="text" class="form-control" id="gen-password" readonly>
              <button class="btn btn-outline-secondary" id="gen-copy" title="Copy" type="button">
                <i class="fa fa-copy" aria-hidden="true"></i>
              </button>
              <button class="btn btn-outline-secondary" id="gen-again" title="Regenerate" type="button">
                <i class="fa fa-refresh" aria-hidden="true"></i>
              </button>
            </div>
            <div class="row g-2 small">
              <div class="col-6"><label class="form-label mb-0">Length</label><input type="number" class="form-control form-control-sm" id="gen-length" min="4" max="128" value="20"></div>
              <div class="col-6 d-flex flex-column justify-content-end">
                <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" id="gen-symbols" checked> Symbols</label>
                <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" id="gen-numbers" checked> Numbers</label>
              </div>
              <div class="col-6">
                <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" id="gen-uppercase" checked> Uppercase</label>
              </div>
              <div class="col-6">
                <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" id="gen-lowercase" checked> Lowercase</label>
              </div>
              <div class="col-12">
                <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" id="gen-ambiguous"> Exclude look-alike characters (0 O I l 1)</label>
              </div>
            </div>
            <div id="gen-error" class="text-danger small mt-2 d-none"></div>
          </div>
          <div class="modal-footer py-2">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-sm btn-primary" id="gen-new-entry">Create entry</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Entry context menu -->
    <div id="entry-menu" class="rf-entry-menu d-none"></div>

    <!-- Floating action button -->
    <div id="fab-container" class="d-none">
      <button id="fab-add" class="rf-fab" title="Add new login">
        <i class="fa fa-plus" aria-hidden="true"></i>
      </button>
    </div>
  </body>
</html>
