<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>PWSave</title>
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="../bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../fonts/fork-awesome.min.css">
    <script src="../common/browser-polyfill.min.js"></script>
    <script src="../common/global.js"></script>
    <script src="../common/global_ui.js"></script>
    <script src="../bootstrap/bootstrap.min.js"></script>
    <script defer src="popup.js"></script>
  </head>
  <body>
    <div class="container pwsave-popup">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <h1 class="h6 mb-0 pwsave-title"><img src="../icons/keepassxc.svg" class="pwsave-logo" alt=""> PWSave</h1>
        <div>
          <button id="options-button" class="btn btn-sm btn-outline-secondary" title="Settings">
            <i class="fa fa-cog" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Sync setup (mandatory) -->
      <div id="sync-setup" class="text-center py-4 d-none">
        <p class="fw-bold mb-1">Connect your Google Drive</p>
        <p class="small text-muted mb-3">Your vault is encrypted on this device. Sign in with Google so your encrypted vault is kept in sync across your browsers.</p>
        <button id="signin-button" class="btn btn-primary w-100 mb-2">
          <i class="fa fa-google" aria-hidden="true"></i> Sign in with Google
        </button>
        <div id="sync-error" class="text-danger small mt-1 d-none"></div>
      </div>

      <!-- Lock screen -->
      <div id="lock-screen" class="text-center py-4 d-none">
        <p class="fw-bold mb-1" id="lock-title">Unlock vault</p>
        <p class="small text-muted mb-3">Enter your master password. The vault is decrypted locally.</p>
        <input id="master-password" type="password" class="form-control mb-2" placeholder="Master password" autocomplete="off">
        <div id="lock-error" class="text-danger small mt-1 mb-1 d-none"></div>
        <button id="unlock-button" class="btn btn-primary w-100">Unlock</button>
      </div>

      <!-- Vault view -->
      <div id="vault-view" class="d-none">
        <div class="input-group mb-2">
          <span class="input-group-text"><i class="fa fa-search" aria-hidden="true"></i></span>
          <input id="search-input" type="text" class="form-control" placeholder="Search entries">
        </div>

        <div id="sync-status" class="small text-muted mb-2 d-flex justify-content-between align-items-center">
          <span id="sync-status-text"></span>
          <span>
            <button id="sync-now-button" class="btn btn-sm btn-outline-secondary" title="Sync now">
              <i class="fa fa-refresh" aria-hidden="true"></i>
            </button>
          </span>
        </div>

        <div id="totp-section" class="mb-2 d-none">
          <div class="d-flex justify-content-between align-items-center">
            <span class="small fw-bold text-muted text-uppercase">Two-factor codes</span>
            <button id="totp-refresh-button" class="btn btn-sm btn-outline-secondary" title="Refresh codes">
              <i class="fa fa-refresh" aria-hidden="true"></i>
            </button>
          </div>
          <div id="totp-list" class="list-group mt-1"></div>
        </div>

        <div id="entry-list" class="list-group"></div>
        <div id="empty-state" class="text-center text-muted py-3 d-none">No entries found.</div>

        <div class="d-flex gap-1 mt-2">
          <button id="add-entry-button" class="btn btn-sm btn-primary flex-fill">
            <i class="fa fa-plus" aria-hidden="true"></i> Add
          </button>
          <button id="generator-button" class="btn btn-sm btn-outline-secondary flex-fill">
            <i class="fa fa-magic" aria-hidden="true"></i> Generator
          </button>
          <button id="lock-button" class="btn btn-sm btn-outline-danger flex-fill">
            <i class="fa fa-lock" aria-hidden="true"></i> Lock
          </button>
        </div>
      </div>

      <!-- Add/Edit modal -->
      <div class="modal fade" id="entry-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header py-2">
              <h5 class="modal-title" id="entry-modal-title">Add entry</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="mb-2">
                <label class="form-label small mb-1">Name</label>
                <input type="text" class="form-control form-control-sm" id="edit-name">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Username</label>
                <input type="text" class="form-control form-control-sm" id="edit-login">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Password</label>
                <div class="input-group input-group-sm">
                  <input type="password" class="form-control" id="edit-password">
                  <button class="btn btn-outline-secondary" id="edit-generate" title="Generate password">
                    <i class="fa fa-magic" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">URL</label>
                <input type="text" class="form-control form-control-sm" id="edit-url">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Note</label>
                <textarea class="form-control form-control-sm" id="edit-note" rows="2"></textarea>
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">TOTP secret (base32) - optional</label>
                <div class="input-group input-group-sm">
                  <input type="text" class="form-control" id="edit-totp-secret" placeholder="JBSWY3DPEHPK3PXP">
                  <input type="text" class="form-control" id="edit-totp-label" placeholder="label (optional)">
                </div>
              </div>
            </div>
            <div class="modal-footer py-2">
              <button type="button" class="btn btn-sm btn-outline-danger d-none" id="delete-entry-button">Delete</button>
              <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-sm btn-primary" id="save-entry-button">Save</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Generator modal -->
      <div class="modal fade" id="generator-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header py-2">
              <h5 class="modal-title">Password generator</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="input-group input-group-sm mb-2">
                <input type="text" class="form-control" id="gen-password" readonly>
                <button class="btn btn-outline-secondary" id="gen-copy" title="Copy">
                  <i class="fa fa-copy" aria-hidden="true"></i>
                </button>
                <button class="btn btn-outline-secondary" id="gen-again" title="Regenerate">
                  <i class="fa fa-refresh" aria-hidden="true"></i>
                </button>
              </div>
              <div class="row g-2 small">
                <div class="col-6"><label class="form-label mb-0">Length</label><input type="number" class="form-control form-control-sm" id="gen-length" min="4" max="128" value="20"></div>
                <div class="col-6 d-flex flex-column justify-content-end">
                  <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" id="gen-symbols" checked> Symbols</label>
                  <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" id="gen-numbers" checked> Numbers</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
